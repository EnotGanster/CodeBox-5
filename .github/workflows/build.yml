name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Resolve Guava and bundletool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          cat > diagnostics/inspect-libraries.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('inspectRuntimeLibraries') {
                          doLast {
                              def config =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              config.resolvedConfiguration
                                  .resolvedArtifacts.each { artifact ->

                                  def id = artifact.moduleVersion.id

                                  if (id.group == 'com.google.guava'
                                          && id.name == 'guava') {
                                      println(
                                          'GUAVA_VERSION=' + id.version
                                      )
                                      println(
                                          'GUAVA_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }

                                  if (id.group ==
                                          'com.android.tools.build'
                                          && id.name == 'bundletool') {
                                      println(
                                          'BUNDLETOOL_VERSION=' + id.version
                                      )
                                      println(
                                          'BUNDLETOOL_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            --init-script diagnostics/inspect-libraries.gradle \
            :app:inspectRuntimeLibraries \
            | tee diagnostics/resolved-libraries.txt

          GUAVA_JAR=$(sed -n \
            's/^GUAVA_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          BUNDLETOOL_JAR=$(sed -n \
            's/^BUNDLETOOL_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          test -s "$GUAVA_JAR"
          test -s "$BUNDLETOOL_JAR"

          javap -classpath "$GUAVA_JAR" \
            -p com.google.common.base.Predicate \
            > diagnostics/guava-predicate.txt

          javap -classpath "$GUAVA_JAR" \
            -p 'com.google.common.base.Predicates$NotPredicate' \
            > diagnostics/guava-not-predicate.txt

          javap -classpath "$BUNDLETOOL_JAR" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            > diagnostics/bundletool-enummapper-bytecode.txt

          {
            sha256sum "$GUAVA_JAR"
            sha256sum "$BUNDLETOOL_JAR"
          } > diagnostics/library-checksums.txt

      - name: Build patched bundletool JAR
        shell: bash
        run: |
          set -euo pipefail

          PATCH="app/libs/enummapper-candidate.jar"

          BUNDLETOOL_JAR=$(sed -n \
            's/^BUNDLETOOL_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          test -s "$PATCH"
          test -s "$BUNDLETOOL_JAR"

          mkdir -p diagnostics/patched-bundletool
          mkdir -p diagnostics/patched-bundletool/work

          OUTPUT="$PWD/diagnostics/patched-bundletool/bundletool-patched-1.18.2.jar"
          WORK="$PWD/diagnostics/patched-bundletool/work"

          CLASS="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          echo "=== Check patch ==="

          unzip -t "$PATCH"

          unzip -Z -1 "$PATCH" \
            | grep -Fx "$CLASS"

          echo "=== Check original ==="

          unzip -t "$BUNDLETOOL_JAR"

          unzip -Z -1 "$BUNDLETOOL_JAR" \
            | grep -Fx "$CLASS"

          echo "=== Extract original bundletool ==="

          (
            cd "$WORK"
            jar xf "$BUNDLETOOL_JAR"
          )

          echo "=== Replace EnumMapper ==="

          (
            cd "$WORK"
            jar xf "$OLDPWD/$PATCH"
          )

          echo "=== Remove stale signatures ==="

          find "$WORK/META-INF" -maxdepth 1 -type f \
            \( -iname '*.SF' \
            -o -iname '*.RSA' \
            -o -iname '*.DSA' \
            -o -iname '*.EC' \) \
            -delete

          echo "=== Create patched bundletool ==="

          (
            cd "$WORK"
            jar cf "$OUTPUT" .
          )

          echo "=== Verify patched bundletool ==="

          unzip -t "$OUTPUT" \
            | tail -n 2

          ORIGINAL_CLASS_SHA=$(
            unzip -p "$BUNDLETOOL_JAR" "$CLASS" \
              | sha256sum | cut -d ' ' -f 1
          )

          PATCH_CLASS_SHA=$(
            unzip -p "$PATCH" "$CLASS" \
              | sha256sum | cut -d ' ' -f 1
          )

          OUTPUT_CLASS_SHA=$(
            unzip -p "$OUTPUT" "$CLASS" \
              | sha256sum | cut -d ' ' -f 1
          )

          {
            echo "Original class: $ORIGINAL_CLASS_SHA"
            echo "Patch class:    $PATCH_CLASS_SHA"
            echo "Output class:   $OUTPUT_CLASS_SHA"
          } | tee diagnostics/patched-bundletool/class-checksums.txt

          test "$PATCH_CLASS_SHA" = "$OUTPUT_CLASS_SHA"

          if [ "$ORIGINAL_CLASS_SHA" = "$OUTPUT_CLASS_SHA" ]; then
            echo "ERROR: EnumMapper was not changed"
            exit 1
          fi

          echo "=== Inspect patched bytecode ==="

          javap -classpath "$OUTPUT" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            > diagnostics/patched-bundletool/patched-enummapper-bytecode.txt

          if grep -q 'com/google/common/base/Predicates.not' \
              diagnostics/patched-bundletool/patched-enummapper-bytecode.txt; then
            echo "ERROR: Old Predicates.not call remains"
            exit 1
          fi

          echo "=== Final checksum ==="

          sha256sum "$OUTPUT" \
            | tee diagnostics/patched-bundletool/SHA256SUMS.txt

          echo "Patched bundletool created successfully."

          rm -rf "$WORK"

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit)

          test -n "$APK"
          test -s "$APK"

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          sha256sum "$APK" \
            | tee diagnostics/apk-sha256.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          test -s "$JAR"

          mkdir -p android-api-export
          cp "$JAR" android-api-export/android.jar

          cd android-api-export
          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload patched bundletool
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patched-Bundletool
          path: diagnostics/patched-bundletool/
          if-no-files-found: error
          retention-days: 30
