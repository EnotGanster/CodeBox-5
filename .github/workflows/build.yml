name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify current bundletool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          ENUM="app/libs/enummapper-candidate.jar"

          test -s "$OLD"
          test -s "$ENUM"

          unzip -t "$OLD" > diagnostics/old-jar-test.txt
          unzip -t "$ENUM" > diagnostics/enum-jar-test.txt

          CLASS="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          SHA1=$(
            unzip -p "$OLD" "$CLASS" |
            sha256sum | cut -d ' ' -f 1
          )

          SHA2=$(
            unzip -p "$ENUM" "$CLASS" |
            sha256sum | cut -d ' ' -f 1
          )

          echo "EnumMapper in bundletool: $SHA1"
          echo "EnumMapper candidate: $SHA2"

          test "$SHA1" = "$SHA2"

          echo "First patch preserved."

          javap -classpath "$OLD" -c -p \
            com.android.tools.build.bundletool.model.utils.BundleModuleParser \
            > diagnostics/current-parser-bytecode.txt

          if grep -Fq \
            'com/google/common/base/Predicates.not' \
            diagnostics/current-parser-bytecode.txt; then
            echo "ERROR: Second patch is missing."
            exit 1
          fi

          echo "Second patch preserved."

      - name: Prepare Java compilation classpath
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          cat > diagnostics/patch-classpath.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('exportPatchClasspath') {
                          doLast {
                              def config =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              def output = new File(
                                  project.rootProject.projectDir,
                                  'diagnostics/patch-classpath.txt'
                              )

                              output.text = config.files
                                  .findAll { it.isFile() }
                                  .collect { it.absolutePath }
                                  .join(File.pathSeparator)

                              println('PATCH_CLASSPATH_READY')
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            --init-script diagnostics/patch-classpath.gradle \
            :app:exportPatchClasspath

          test -s diagnostics/patch-classpath.txt

      - name: Download official XML parser source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patch-work/source
          mkdir -p diagnostics

          SOURCE="patch-work/source/XmlProtoElementOrBuilder.java"

          URL="https://raw.githubusercontent.com/google/bundletool/1.18.2/src/main/java/com/android/tools/build/bundletool/model/utils/xmlproto/XmlProtoElementOrBuilder.java"

          curl --fail --location \
            --retry 3 \
            --connect-timeout 20 \
            --output "$SOURCE" \
            "$URL"

          test -s "$SOURCE"

          grep -Fq \
            'class XmlProtoElementOrBuilder' \
            "$SOURCE"

          cp "$SOURCE" \
            diagnostics/original-XmlProtoElementOrBuilder.java

          sha256sum "$SOURCE" \
            | tee diagnostics/original-xml-source-sha256.txt

      - name: Apply third patch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "patch-work/source/XmlProtoElementOrBuilder.java"
          )

          source = path.read_text(encoding="utf-8")

          old = ".filter(predicate);"
          new = ".filter(predicate::apply);"

          count = source.count(old)

          print("MATCHES=" + str(count))

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected one predicate call, found "
                  + str(count)
              )

          patched = source.replace(old, new, 1)

          path.write_text(
              patched,
              encoding="utf-8"
          )

          print("THIRD_PATCH_APPLIED")
          PY

          cp patch-work/source/XmlProtoElementOrBuilder.java \
            diagnostics/patched-XmlProtoElementOrBuilder.java

          grep -F \
            '.filter(predicate::apply);' \
            patch-work/source/XmlProtoElementOrBuilder.java

      - name: Compile third patch
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patch-work/classes

          OLD="app/libs/bundletool-patched-1.18.2.jar"

          RUNTIME_CP=$(cat diagnostics/patch-classpath.txt)

          CP="$OLD:$RUNTIME_CP"

          javac \
            -source 8 \
            -target 8 \
            -proc:none \
            -classpath "$CP" \
            -d patch-work/classes \
            patch-work/source/XmlProtoElementOrBuilder.java \
            2>&1 | tee diagnostics/xml-javac.txt

          CLASS="com/android/tools/build/bundletool/model/utils/xmlproto/XmlProtoElementOrBuilder.class"

          test -s "patch-work/classes/$CLASS"

          echo "Third patch compiled."

      - name: Create patched bundletool v3
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patched-output

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          NEW="patched-output/bundletool-patched-1.18.2.jar"

          cp "$OLD" "$NEW"

          (
            cd patch-work/classes

            jar uf "../../$NEW" \
              com/android/tools/build/bundletool/model/utils/xmlproto/XmlProtoElementOrBuilder.class
          )

          test -s "$NEW"

          unzip -t "$NEW" | tail -n 2

          echo "Patched bundletool v3 created."

      - name: Verify all three patches
        shell: bash
        run: |
          set -euo pipefail

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          NEW="patched-output/bundletool-patched-1.18.2.jar"

          ENUM="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          PARSER="com/android/tools/build/bundletool/model/utils/BundleModuleParser.class"

          XML="com/android/tools/build/bundletool/model/utils/xmlproto/XmlProtoElementOrBuilder.class"

          echo "=== Verify first patch ==="

          OLD_SHA=$(
            unzip -p "$OLD" "$ENUM" |
            sha256sum | cut -d ' ' -f 1
          )

          NEW_SHA=$(
            unzip -p "$NEW" "$ENUM" |
            sha256sum | cut -d ' ' -f 1
          )

          test "$OLD_SHA" = "$NEW_SHA"

          echo "EnumMapper preserved."

          echo "=== Verify second patch ==="

          OLD_SHA=$(
            unzip -p "$OLD" "$PARSER" |
            sha256sum | cut -d ' ' -f 1
          )

          NEW_SHA=$(
            unzip -p "$NEW" "$PARSER" |
            sha256sum | cut -d ' ' -f 1
          )

          test "$OLD_SHA" = "$NEW_SHA"

          echo "BundleModuleParser preserved."

          echo "=== Verify third patch ==="

          OLD_SHA=$(
            unzip -p "$OLD" "$XML" |
            sha256sum | cut -d ' ' -f 1
          )

          NEW_SHA=$(
            unzip -p "$NEW" "$XML" |
            sha256sum | cut -d ' ' -f 1
          )

          echo "OLD_XML_SHA=$OLD_SHA"
          echo "NEW_XML_SHA=$NEW_SHA"

          if [ "$OLD_SHA" = "$NEW_SHA" ]; then
            echo "XmlProtoElementOrBuilder already patched."
            echo "Checking bytecode."
          else
            echo "XmlProtoElementOrBuilder updated."
          fi

          echo "=== Inspect XML parser bytecode ==="

          javap -classpath "$NEW" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.xmlproto.XmlProtoElementOrBuilder \
            | tee diagnostics/new-xml-bytecode.txt

          echo "=== Verify stream predicate adapter ==="

          python3 - <<'PY'
          from pathlib import Path

          code = Path(
              "diagnostics/new-xml-bytecode.txt"
          ).read_text()

          if "java/util/stream/Stream.filter" not in code:
              raise SystemExit(
                  "ERROR: Stream.filter missing."
              )

          if "lambda$getChildrenElements$" not in code:
              raise SystemExit(
                  "ERROR: Expected lambda adapter missing."
              )

          print("XML_PREDICATE_ADAPTER_VERIFIED")
          PY

          echo "=== Verify all JAR files ==="

          unzip -t "$NEW" | tail -n 2

          sha256sum "$OLD" "$NEW" \
            | tee diagnostics/bundletool-v3-checksums.txt

          echo "All three patches verified."

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon assembleDebug

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)

          test -n "$APK"
          test -s "$APK"

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          sha256sum "$APK" \
            | tee diagnostics/apk-sha256.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            test -x "$SDKMANAGER"

            "$SDKMANAGER" "platforms;android-35"
          fi

          test -s "$JAR"

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          (
            cd android-api-export
            sha256sum android.jar > SHA256SUMS.txt
          )

      - name: Upload Android API 35
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload patched bundletool v3
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patched-Bundletool-v3
          path: patched-output/bundletool-patched-1.18.2.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patch-Diagnostics-v3
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
