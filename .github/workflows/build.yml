name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check patched bundletool files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          PATCH="app/libs/enummapper-candidate.jar"
          BUNDLETOOL="app/libs/bundletool-patched-1.18.2.jar"

          echo "=== Check local JAR files ==="

          test -s "$PATCH"
          test -s "$BUNDLETOOL"

          echo "=== Verify JAR archives ==="

          unzip -t "$PATCH" | tail -n 2
          unzip -t "$BUNDLETOOL" | tail -n 2

          CLASS="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          echo "=== Verify EnumMapper ==="

          unzip -Z -1 "$PATCH" | grep -Fx "$CLASS"
          unzip -Z -1 "$BUNDLETOOL" | grep -Fx "$CLASS"

          PATCH_SHA=$(
            unzip -p "$PATCH" "$CLASS" |
              sha256sum | cut -d ' ' -f 1
          )

          BUNDLETOOL_SHA=$(
            unzip -p "$BUNDLETOOL" "$CLASS" |
              sha256sum | cut -d ' ' -f 1
          )

          {
            echo "Patch class: $PATCH_SHA"
            echo "Bundletool class: $BUNDLETOOL_SHA"
          } | tee diagnostics/enummapper-checksums.txt

          test "$PATCH_SHA" = "$BUNDLETOOL_SHA"

          echo "=== Inspect patched EnumMapper ==="

          javap -classpath "$BUNDLETOOL" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            | tee diagnostics/patched-enummapper-bytecode.txt

          if grep -q 'com/google/common/base/Predicates.not' \
              diagnostics/patched-enummapper-bytecode.txt; then
            echo "ERROR: Old Predicate call remains"
            exit 1
          fi

          echo "=== Check JAR checksum ==="

          sha256sum "$BUNDLETOOL" |
            tee diagnostics/patched-bundletool-sha256.txt

          echo "Patched bundletool verification passed."

      - name: Diagnose BundleModuleParser
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          BUNDLETOOL="app/libs/bundletool-patched-1.18.2.jar"

          CLASS="com.android.tools.build.bundletool.model.utils.BundleModuleParser"

          CLASS_FILE="com/android/tools/build/bundletool/model/utils/BundleModuleParser.class"

          echo "=== Verify BundleModuleParser exists ==="

          test -s "$BUNDLETOOL"

          jar tf "$BUNDLETOOL" |
            grep -Fx "$CLASS_FILE"

          echo "=== Full BundleModuleParser bytecode ==="

          javap -classpath "$BUNDLETOOL" \
            -c -p -l "$CLASS" \
            | tee diagnostics/bundle-module-parser-bytecode.txt

          echo "=== Predicate references ==="

          grep -n -C 12 -E \
            'Predicates|Predicate|Stream.filter|ReferencePipeline' \
            diagnostics/bundle-module-parser-bytecode.txt \
            | tee diagnostics/bundle-module-parser-predicates.txt \
            || true

          echo "=== Source line mapping ==="

          grep -n -A 45 -B 15 'LineNumberTable:' \
            diagnostics/bundle-module-parser-bytecode.txt \
            | head -n 160 \
            | tee diagnostics/bundle-module-parser-lines.txt \
            || true

          echo "=== Scan bundletool bytecode for predicate calls ==="

          javap -classpath "$BUNDLETOOL" \
            -c -p "$CLASS" \
            | grep -n -C 8 'com/google/common/base/Predicates' \
            | tee diagnostics/bundle-module-parser-guava-calls.txt \
            || true

          echo "BundleModuleParser diagnostics completed."

      - name: Diagnose dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "=== Guava dependency insight ==="

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          echo "=== Runtime dependencies ==="

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon assembleDebug

      - name: Diagnose runtime Guava
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          cat > diagnostics/inspect-guava.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('inspectRuntimeGuava') {
                          doLast {
                              def config =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              config.resolvedConfiguration
                                  .resolvedArtifacts.each { artifact ->

                                  def id = artifact.moduleVersion.id

                                  if (id.group == 'com.google.guava'
                                          && id.name == 'guava') {
                                      println(
                                          'GUAVA_VERSION=' + id.version
                                      )
                                      println(
                                          'GUAVA_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            --init-script diagnostics/inspect-guava.gradle \
            :app:inspectRuntimeGuava \
            | tee diagnostics/resolved-guava.txt

          GUAVA_JAR=$(sed -n \
            's/^GUAVA_JAR=//p' \
            diagnostics/resolved-guava.txt \
            | tail -n 1)

          if [ -z "$GUAVA_JAR" ] || \
             [ ! -s "$GUAVA_JAR" ]; then
            echo "ERROR: Guava JAR not found"
            exit 1
          fi

          echo "=== Guava Predicate ==="

          javap -classpath "$GUAVA_JAR" \
            -p com.google.common.base.Predicate \
            | tee diagnostics/guava-predicate.txt

          echo "=== Guava NotPredicate ==="

          javap -classpath "$GUAVA_JAR" \
            -p 'com.google.common.base.Predicates$NotPredicate' \
            | tee diagnostics/guava-not-predicate.txt

          echo "=== Guava checksum ==="

          sha256sum "$GUAVA_JAR" \
            | tee diagnostics/guava-sha256.txt

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          echo "=== APK DEX files ==="

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          echo "=== APK checksum ==="

          sha256sum "$APK" \
            | tee diagnostics/apk-sha256.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            echo "Installing Android API 35..."

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -s "$JAR" ]; then
            echo "ERROR: android.jar not found"
            exit 1
          fi

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          cd android-api-export

          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload patched bundletool
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patched-Bundletool
          path: app/libs/bundletool-patched-1.18.2.jar
          if-no-files-found: warn
          retention-days: 30
