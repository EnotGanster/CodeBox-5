name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose Guava dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "=== Guava dependency insight ==="

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          echo "=== Runtime dependency tree ==="

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

          echo "=== Guava references ==="

          grep -i -E \
            'guava|listenablefuture|failureaccess|bundletool' \
            diagnostics/debug-runtime-dependencies.txt \
            || true

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            echo "Android API 35 is missing."
            echo "Installing Android SDK Platform 35..."

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -s "$JAR" ]; then
            echo "ERROR: android.jar missing or empty"
            exit 1
          fi

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          cd android-api-export

          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
