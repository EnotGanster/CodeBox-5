name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Resolve Guava and bundletool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          cat > diagnostics/inspect-libraries.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('inspectRuntimeLibraries') {
                          doLast {
                              def config =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              config.resolvedConfiguration
                                  .resolvedArtifacts.each { artifact ->

                                  def id = artifact.moduleVersion.id

                                  if (id.group == 'com.google.guava'
                                          && id.name == 'guava') {
                                      println(
                                          'GUAVA_VERSION=' + id.version
                                      )
                                      println(
                                          'GUAVA_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }

                                  if (id.group ==
                                          'com.android.tools.build'
                                          && id.name == 'bundletool') {
                                      println(
                                          'BUNDLETOOL_VERSION=' + id.version
                                      )
                                      println(
                                          'BUNDLETOOL_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            --init-script diagnostics/inspect-libraries.gradle \
            :app:inspectRuntimeLibraries \
            | tee diagnostics/resolved-libraries.txt

          GUARDED_JAR=$(sed -n \
            's/^GUAVA_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          BUNDLETOOL_JAR=$(sed -n \
            's/^BUNDLETOOL_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          test -s "$GUARDED_JAR"
          test -s "$BUNDLETOOL_JAR"

          echo "=== Guava Predicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p com.google.common.base.Predicate \
            | tee diagnostics/guava-predicate.txt

          echo "=== Guava NotPredicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p 'com.google.common.base.Predicates$NotPredicate' \
            | tee diagnostics/guava-not-predicate.txt

          echo "=== Original EnumMapper ==="

          javap -classpath "$BUNDLETOOL_JAR" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            | tee diagnostics/bundletool-enummapper-bytecode.txt

          echo "=== JAR checksums ==="

          {
            sha256sum "$GUARDED_JAR"
            sha256sum "$BUNDLETOOL_JAR"
          } | tee diagnostics/library-checksums.txt

      - name: Compile EnumMapper compatibility candidate
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics/patch-src
          mkdir -p diagnostics/patch-classes
          mkdir -p diagnostics/patch-output

          GUARDED_JAR=$(sed -n \
            's/^GUAVA_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          BUNDLETOOL_JAR=$(sed -n \
            's/^BUNDLETOOL_JAR=//p' \
            diagnostics/resolved-libraries.txt \
            | tail -n 1)

          cat > diagnostics/patch-src/EnumMapper.java <<'EOF'
          package com.android.tools.build.bundletool.model.utils;

          import com.google.common.collect.ImmutableBiMap;
          import com.google.common.collect.ImmutableSet;
          import com.google.common.collect.ImmutableSortedMap;
          import com.google.common.collect.Ordering;

          import java.util.EnumSet;
          import java.util.function.Predicate;

          public final class EnumMapper {

              private EnumMapper() {
              }

              public static <E1 extends Enum<E1>, E2 extends Enum<E2>>
                      ImmutableBiMap<E1, E2> mapByName(
                              Class<E1> first,
                              Class<E2> second) {

                  return mapByName(
                          first,
                          second,
                          ImmutableSet.of()
                  );
              }

              public static <E1 extends Enum<E1>, E2 extends Enum<E2>>
                      ImmutableBiMap<E1, E2> mapByName(
                              Class<E1> first,
                              Class<E2> second,
                              ImmutableSet<E1> excluded) {

                  ImmutableSortedMap<String, E1> left =
                          enumValuesByName(first, excluded);

                  ImmutableSortedMap<String, E2> right =
                          enumValuesByName(
                                  second,
                                  ImmutableSet.of()
                          );

                  if (!left.keySet().equals(right.keySet())) {
                      throw new IllegalArgumentException(
                              "Enum values differ: "
                                      + left.keySet()
                                      + " vs "
                                      + right.keySet()
                      );
                  }

                  ImmutableBiMap.Builder<E1, E2> builder =
                          ImmutableBiMap.builder();

                  for (String name : left.keySet()) {
                      builder.put(
                              left.get(name),
                              right.get(name)
                      );
                  }

                  return builder.build();
              }

              private static <E extends Enum<E>>
                      ImmutableSortedMap<String, E> enumValuesByName(
                              Class<E> enumClass,
                              ImmutableSet<E> excluded) {

                  Predicate<E> included =
                          value -> !excluded.contains(value);

                  return EnumSet.allOf(enumClass)
                          .stream()
                          .filter(included)
                          .sorted()
                          .collect(
                                  ImmutableSortedMap.toImmutableSortedMap(
                                          Ordering.natural(),
                                          Enum::name,
                                          value -> value
                                  )
                          );
              }
          }
          EOF

          echo "=== Compile compatibility candidate ==="

          javac --release 8 \
            -cp "$GUARDED_JAR:$BUNDLETOOL_JAR" \
            -d diagnostics/patch-classes \
            diagnostics/patch-src/EnumMapper.java \
            2>&1 | tee diagnostics/patch-compile.txt

          echo "=== Inspect patched bytecode ==="

          javap -classpath diagnostics/patch-classes \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            | tee diagnostics/patched-enummapper-bytecode.txt

          echo "=== Package patch candidate ==="

          jar --create \
            --file diagnostics/patch-output/enummapper-candidate.jar \
            -C diagnostics/patch-classes .

          echo "=== Verify patch JAR ==="

          jar tf \
            diagnostics/patch-output/enummapper-candidate.jar \
            | tee diagnostics/patch-jar-contents.txt

          sha256sum \
            diagnostics/patch-output/enummapper-candidate.jar \
            | tee diagnostics/patch-sha256.txt

          echo "Patch candidate compiled successfully."
          echo "It has NOT been integrated into the Android APK."

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit)

          test -n "$APK"
          test -s "$APK"

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          sha256sum "$APK" \
            | tee diagnostics/apk-sha256.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          test -s "$JAR"

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          cd android-api-export

          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload EnumMapper patch candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-EnumMapper-Patch
          path: diagnostics/patch-output/
          if-no-files-found: warn
          retention-days: 30
