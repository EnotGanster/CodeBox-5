name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose Guava dependencies
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Diagnose actual Guava JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "=== Create Gradle diagnostic task ==="

          cat > diagnostics/guava-init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('printGuavaRuntimeJar') {
                          doLast {
                              def config =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              config.resolvedConfiguration
                                  .resolvedArtifacts.each { artifact ->

                                  def id = artifact.moduleVersion.id

                                  if (id.group == 'com.google.guava'
                                          && id.name == 'guava') {
                                      println(
                                          'GUAVA_VERSION=' + id.version
                                      )
                                      println(
                                          'GUAVA_JAR=' +
                                          artifact.file.absolutePath
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          echo "=== Resolve actual runtime artifacts ==="

          gradle --no-daemon \
            --init-script diagnostics/guava-init.gradle \
            :app:printGuavaRuntimeJar \
            | tee diagnostics/guava-resolved-artifact.txt

          GUARDED_JAR=$(sed -n \
            's/^GUAVA_JAR=//p' \
            diagnostics/guava-resolved-artifact.txt \
            | tail -n 1)

          if [ -z "$GUARDED_JAR" ]; then
            echo "ERROR: Gradle did not report Guava JAR"
            exit 1
          fi

          if [ ! -s "$GUARDED_JAR" ]; then
            echo "ERROR: Guava JAR missing or empty"
            exit 1
          fi

          echo "=== Actual Guava JAR ==="
          echo "$GUARDED_JAR"

          echo "=== Guava Predicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p com.google.common.base.Predicate \
            | tee diagnostics/guava-predicate.txt

          echo "=== Guava NotPredicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p 'com.google.common.base.Predicates$NotPredicate' \
            | tee diagnostics/guava-not-predicate.txt

          echo "=== Guava bytecode details ==="

          javap -classpath "$GUARDED_JAR" \
            -v com.google.common.base.Predicate \
            > diagnostics/guava-predicate-verbose.txt

          echo "=== Guava JAR checksum ==="

          sha256sum "$GUARDED_JAR" \
            | tee diagnostics/guava-sha256.txt

          echo "Guava diagnostic completed."

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          echo "=== APK DEX entries ==="

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          echo "=== APK file ==="
          echo "$APK"

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            echo "Android API 35 is missing."
            echo "Installing Android SDK Platform 35..."

            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -s "$JAR" ]; then
            echo "ERROR: android.jar missing or empty"
            exit 1
          fi

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          cd android-api-export

          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
