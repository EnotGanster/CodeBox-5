name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify existing patched bundletool
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          PATCH="app/libs/enummapper-candidate.jar"

          test -s "$OLD"
          test -s "$PATCH"

          unzip -t "$OLD" > diagnostics/old-jar-test.txt
          unzip -t "$PATCH" > diagnostics/enum-jar-test.txt

          CLASS="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          OLD_SHA=$(
            unzip -p "$OLD" "$CLASS" |
              sha256sum | cut -d ' ' -f 1
          )

          PATCH_SHA=$(
            unzip -p "$PATCH" "$CLASS" |
              sha256sum | cut -d ' ' -f 1
          )

          echo "Existing EnumMapper: $OLD_SHA"
          echo "Candidate EnumMapper: $PATCH_SHA"

          test "$OLD_SHA" = "$PATCH_SHA"

          echo "Existing EnumMapper patch verified."

      - name: Prepare compilation classpath
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          cat > diagnostics/patch-classpath.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.path == ':app') {
                      project.tasks.register('exportPatchClasspath') {
                          doLast {
                              def configuration =
                                  project.configurations.getByName(
                                      'debugRuntimeClasspath'
                                  )

                              def output = new File(
                                  project.rootProject.projectDir,
                                  'diagnostics/patch-classpath.txt'
                              )

                              def files = configuration.files
                                  .findAll { it.isFile() }

                              output.text = files
                                  .collect { it.absolutePath }
                                  .join(File.pathSeparator)

                              println(
                                  'PATCH_CLASSPATH_FILES=' + files.size()
                              )
                          }
                      }
                  }
              }
          }
          EOF

          gradle --no-daemon \
            --init-script diagnostics/patch-classpath.gradle \
            :app:exportPatchClasspath

          test -s diagnostics/patch-classpath.txt

          echo "Classpath prepared."

      - name: Download official BundleModuleParser source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patch-work/source
          mkdir -p diagnostics

          SOURCE="patch-work/source/BundleModuleParser.java"

          URL="https://raw.githubusercontent.com/google/bundletool/1.18.2/src/main/java/com/android/tools/build/bundletool/model/utils/BundleModuleParser.java"

          curl --fail --location \
            --retry 3 \
            --connect-timeout 20 \
            --output "$SOURCE" \
            "$URL"

          test -s "$SOURCE"

          grep -Fq \
            'class BundleModuleParser' \
            "$SOURCE"

          cp "$SOURCE" \
            diagnostics/original-BundleModuleParser.java

          sha256sum "$SOURCE" |
            tee diagnostics/original-parser-sha256.txt

          echo "Official source downloaded."

      - name: Patch BundleModuleParser
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "patch-work/source/BundleModuleParser.java"
          )

          source = path.read_text(encoding="utf-8")

          pattern = (
              r'\.filter\s*\(\s*'
              r'not\s*\(\s*ZipEntry::isDirectory\s*\)'
              r'\s*\)'
          )

          replacement = (
              '.filter(entry -> !entry.isDirectory())'
          )

          patched, count = re.subn(
              pattern,
              replacement,
              source
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Expected exactly one filter, found "
                  + str(count)
              )

          path.write_text(
              patched,
              encoding="utf-8"
          )

          print("PATCH_REPLACEMENTS=" + str(count))
          print("BundleModuleParser patch applied.")
          PY

          cp patch-work/source/BundleModuleParser.java \
            diagnostics/patched-BundleModuleParser.java

          grep -F \
            '.filter(entry -> !entry.isDirectory())' \
            patch-work/source/BundleModuleParser.java

      - name: Compile patched BundleModuleParser
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patch-work/classes

          OLD="app/libs/bundletool-patched-1.18.2.jar"

          RUNTIME_CP=$(cat diagnostics/patch-classpath.txt)

          CP="$OLD:$RUNTIME_CP"

          javac \
            -source 8 \
            -target 8 \
            -proc:none \
            -classpath "$CP" \
            -d patch-work/classes \
            patch-work/source/BundleModuleParser.java \
            2>&1 | tee diagnostics/parser-javac.txt

          CLASS="com/android/tools/build/bundletool/model/utils/BundleModuleParser.class"

          test -s "patch-work/classes/$CLASS"

          echo "BundleModuleParser compiled."

      - name: Create second patched bundletool JAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p patched-output

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          NEW="patched-output/bundletool-patched-1.18.2.jar"

          cp "$OLD" "$NEW"

          (
            cd patch-work/classes

            jar uf "../../$NEW" \
              com/android/tools/build/bundletool/model/utils/BundleModuleParser.class
          )

          test -s "$NEW"

          unzip -t "$NEW" | tail -n 2

          echo "Second patched JAR created."

      - name: Verify both patches
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          OLD="app/libs/bundletool-patched-1.18.2.jar"
          NEW="patched-output/bundletool-patched-1.18.2.jar"

          ENUM="com/android/tools/build/bundletool/model/utils/EnumMapper.class"

          PARSER="com/android/tools/build/bundletool/model/utils/BundleModuleParser.class"

          echo "=== Verify EnumMapper unchanged ==="

          OLD_ENUM_SHA=$(
            unzip -p "$OLD" "$ENUM" |
              sha256sum | cut -d ' ' -f 1
          )

          NEW_ENUM_SHA=$(
            unzip -p "$NEW" "$ENUM" |
              sha256sum | cut -d ' ' -f 1
          )

          echo "OLD_ENUM_SHA=$OLD_ENUM_SHA"
          echo "NEW_ENUM_SHA=$NEW_ENUM_SHA"

          test "$OLD_ENUM_SHA" = "$NEW_ENUM_SHA"

          echo "EnumMapper preserved."

          echo "=== Verify BundleModuleParser replacement ==="

          OLD_PARSER_SHA=$(
            unzip -p "$OLD" "$PARSER" |
              sha256sum | cut -d ' ' -f 1
          )

          NEW_PARSER_SHA=$(
            unzip -p "$NEW" "$PARSER" |
              sha256sum | cut -d ' ' -f 1
          )

          echo "OLD_PARSER_SHA=$OLD_PARSER_SHA"
          echo "NEW_PARSER_SHA=$NEW_PARSER_SHA"

          if [ "$OLD_PARSER_SHA" = "$NEW_PARSER_SHA" ]; then
            echo "WARNING: Parser checksums are identical."
            echo "Inspecting actual bytecode."
          else
            echo "BundleModuleParser class changed."
          fi

          echo "=== Inspect old parser ==="

          javap -classpath "$OLD" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.BundleModuleParser \
            | tee diagnostics/old-parser-bytecode.txt

          echo "=== Inspect new parser ==="

          javap -classpath "$NEW" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.BundleModuleParser \
            | tee diagnostics/new-parser-bytecode.txt

          echo "=== Verify incompatible predicate removed ==="

          if grep -Fq \
            'com/google/common/base/Predicates.not' \
            diagnostics/new-parser-bytecode.txt; then

            echo "ERROR: Incompatible Predicates.not remains."
            exit 1
          fi

          grep -Fq \
            'java/util/stream/Stream.filter' \
            diagnostics/new-parser-bytecode.txt

          echo "BundleModuleParser bytecode verified."

          echo "=== Verify EnumMapper bytecode ==="

          javap -classpath "$NEW" \
            -c -p \
            com.android.tools.build.bundletool.model.utils.EnumMapper \
            | tee diagnostics/new-enummapper-bytecode.txt

          if grep -Fq \
            'com/google/common/base/Predicates.not' \
            diagnostics/new-enummapper-bytecode.txt; then

            echo "ERROR: EnumMapper regression."
            exit 1
          fi

          echo "=== Verify JAR integrity ==="

          unzip -t "$NEW" |
            tail -n 2

          echo "=== Checksums ==="

          sha256sum "$OLD" "$NEW" |
            tee diagnostics/bundletool-checksums.txt

          echo "Both patches verified."

      - name: Diagnose dependencies
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          gradle --no-daemon \
            :app:dependencies \
            --configuration debugRuntimeClasspath \
            | tee diagnostics/debug-runtime-dependencies.txt

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon assembleDebug

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name '*.apk' \
            -print -quit)

          test -n "$APK"
          test -s "$APK"

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          sha256sum "$APK" |
            tee diagnostics/apk-sha256.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            test -x "$SDKMANAGER"

            "$SDKMANAGER" "platforms;android-35"
          fi

          test -s "$JAR"

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          (
            cd android-api-export
            sha256sum android.jar > SHA256SUMS.txt
          )

      - name: Upload Android API 35
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload patched bundletool v2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patched-Bundletool-v2
          path: patched-output/bundletool-patched-1.18.2.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Patch-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
