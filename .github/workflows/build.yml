name: Build CodeBox 5 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Diagnose Guava bytecode
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p diagnostics

          echo "=== Resolve Guava ==="

          gradle --no-daemon \
            :app:dependencyInsight \
            --configuration debugRuntimeClasspath \
            --dependency com.google.guava:guava \
            | tee diagnostics/guava-dependency-insight.txt

          echo "=== Locate Guava JAR ==="

          GUARDED_JAR=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.guava/guava/33.3.1-jre" \
            -type f -name 'guava-33.3.1-jre.jar' \
            -print -quit)

          if [ -z "$GUARDED_JAR" ]; then
            echo "ERROR: Guava JAR not found"
            exit 1
          fi

          echo "Guava JAR: $GUARDED_JAR" \
            | tee diagnostics/guava-jar-path.txt

          echo "=== Guava Predicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p com.google.common.base.Predicate \
            | tee diagnostics/guava-predicate.txt

          echo "=== Guava NotPredicate ==="

          javap -classpath "$GUARDED_JAR" \
            -p 'com.google.common.base.Predicates$NotPredicate' \
            | tee diagnostics/guava-not-predicate.txt

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Diagnose APK DEX
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          echo "=== APK DEX entries ==="

          unzip -Z -1 "$APK" \
            | grep -E '^classes[0-9]*\.dex$' \
            | tee diagnostics/apk-dex-files.txt

          echo "=== DEX inspection instructions ==="

          {
            echo "APK: $APK"
            echo "The original Guava class signatures are in:"
            echo "guava-predicate.txt"
            echo "guava-not-predicate.txt"
            echo
            echo "Runtime verification from CodeBox:"
            echo "Guava Predicate implements Java Predicate: false"
            echo "NotPredicate implements Java Predicate: false"
            echo
            echo "This step verifies APK DEX presence only."
            echo "It does not yet inspect DEX class interfaces."
          } | tee diagnostics/apk-dex-report.txt

      - name: Prepare Android API 35
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK not found"
            exit 1
          fi

          JAR="$SDK/platforms/android-35/android.jar"

          if [ ! -s "$JAR" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

            if [ ! -x "$SDKMANAGER" ]; then
              echo "ERROR: sdkmanager not found"
              exit 1
            fi

            "$SDKMANAGER" "platforms;android-35"
          fi

          if [ ! -s "$JAR" ]; then
            echo "ERROR: android.jar missing or empty"
            exit 1
          fi

          mkdir -p android-api-export

          cp "$JAR" android-api-export/android.jar

          cd android-api-export

          sha256sum android.jar > SHA256SUMS.txt

          echo "Android API 35 prepared."
          cat SHA256SUMS.txt

      - name: Upload Android API 35
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Android-API-35
          path: android-api-export/
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Guava diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeBox-5-Guava-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 30
