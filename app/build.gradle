plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        // Отдельное тестовое приложение
        applicationId 'ru.codebox.jnitest'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Извлекать libaapt2.so из APK
            // в каталог нативных библиотек.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ECJ для Android 12
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // CLASS -> DEX
    implementation 'com.android.tools:r8:8.7.18'

    // Подпись APK
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Android App Bundle
    implementation 'com.android.tools.build:bundletool:1.18.2'
}
