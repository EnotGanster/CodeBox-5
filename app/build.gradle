plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.drop55'

        minSdk 26
        targetSdk 28

        versionCode 1
        versionName '5.5-drop'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }

        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }
}

// Отдельная Guava JRE для CodeBox.

configurations {
    guavaJreJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

configurations.configureEach { configuration ->

    if (configuration.name != 'guavaJreJar') {

        configuration.exclude(
            group: 'com.google.guava',
            module: 'guava'
        )

        // Исправление дублирования ListenableFuture
        configuration.exclude(
            group: 'com.google.guava',
            module: 'listenablefuture'
        )
    }
}

dependencies {

    // AndroidX
    implementation 'androidx.core:core:1.13.1'

    // Java compiler
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // D8 / R8
    implementation 'com.android.tools:r8:8.7.18'

    // APK signing
    implementation 'com.android.tools.build:apksig:8.7.3'

    // AAB / Bundletool
    implementation 'com.android.tools.build:bundletool:1.18.2'

    // Protobuf
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Guava JRE
    guavaJreJar 'com.google.guava:guava:33.3.1-jre@jar'

    implementation files(configurations.guavaJreJar)

    implementation 'com.google.guava:failureaccess:1.0.2'

    // Bouncy Castle
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'

    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
