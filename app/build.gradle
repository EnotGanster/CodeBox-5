plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ---------------------------------------------
// CodeBox 5 - bundletool dependencies
// ---------------------------------------------

configurations {
    bundletoolDependencies {
        transitive = true
    }

    // Download the JRE artifact separately.
    guavaJreJar {
        transitive = false
        canBeConsumed = false
        canBeResolved = true

        attributes {
            attribute(
                org.gradle.api.attributes.Usage.USAGE_ATTRIBUTE,
                objects.named(
                    org.gradle.api.attributes.Usage,
                    org.gradle.api.attributes.Usage.JAVA_RUNTIME
                )
            )

            attribute(
                org.gradle.api.attributes.LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
                objects.named(
                    org.gradle.api.attributes.LibraryElements,
                    org.gradle.api.attributes.LibraryElements.JAR
                )
            )
        }
    }
}

// ---------------------------------------------
// Main dependencies
// ---------------------------------------------

dependencies {

    implementation 'org.eclipse.jdt:ecj:3.18.0'

    implementation 'com.android.tools:r8:8.7.18'

    implementation 'com.android.tools.build:apksig:8.7.3'

    implementation files(
        'libs/bundletool-patched-1.18.2.jar'
    )

    bundletoolDependencies(
        'com.android.tools.build:bundletool:1.18.2'
    )

    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    implementation 'com.google.guava:guava:33.3.1-jre'

    // Explicit JRE artifact classifier.
    guavaJreJar(
        'com.google.guava:guava:33.3.1-jre@jar'
    )

    // Include the separately resolved JAR in the APK.
    implementation files({
        configurations.guavaJreJar.files
    })
}

// ---------------------------------------------
// Transfer bundletool dependencies
// ---------------------------------------------

def bundletoolDependencyArtifacts =
    configurations.bundletoolDependencies
        .incoming
        .resolutionResult

afterEvaluate {

    def rootComponent =
        bundletoolDependencyArtifacts.root

    rootComponent.dependencies.each { dependency ->

        if (dependency instanceof
                org.gradle.api.artifacts.result.ResolvedDependencyResult) {

            def selected = dependency.selected

            if (selected.moduleVersion != null
                    && selected.moduleVersion.group ==
                    'com.android.tools.build'
                    && selected.moduleVersion.name == 'bundletool') {

                selected.dependencies.each { child ->

                    if (child instanceof
                            org.gradle.api.artifacts.result.ResolvedDependencyResult) {

                        def module = child.selected.moduleVersion

                        if (module != null
                                && !(module.group ==
                                    'com.android.tools.build'
                                    && module.name == 'bundletool')) {

                            dependencies.add(
                                'implementation',
                                "${module.group}:${module.name}:${module.version}"
                            )
                        }
                    }
                }
            }
        }
    }
}

// ---------------------------------------------
// Guava diagnostics
// ---------------------------------------------

tasks.register('diagnoseGuava') {

    doLast {

        println ''
        println '========================================'
        println 'CODEBOX 5 - GUAVA JRE DIAGNOSTICS'
        println '========================================'

        def targetClass =
            'com/google/common/collect/Streams.class'

        def jreFiles =
            configurations.guavaJreJar.resolve()

        boolean jreStreamsFound = false

        println ''
        println '--- Explicit JRE artifacts ---'

        jreFiles.each { file ->

            println "GUAVA_JRE_FILE: ${file.name}"
            println "GUAVA_JRE_SIZE: ${file.length()}"

            if (file.name.endsWith('.jar')) {

                def zip = new java.util.zip.ZipFile(file)

                try {
                    if (zip.getEntry(targetClass) != null) {
                        jreStreamsFound = true
                        println 'GUAVA_JRE_STREAMS: FOUND'
                    } else {
                        println 'GUAVA_JRE_STREAMS: MISSING'
                    }
                } finally {
                    zip.close()
                }
            }
        }

        println ''
        println '--- Android runtime artifacts ---'

        def runtime =
            configurations.getByName(
                'debugRuntimeClasspath'
            )

        def artifacts =
            runtime.resolvedConfiguration.resolvedArtifacts

        int guavaArtifactCount = 0
        boolean runtimeStreamsFound = false

        artifacts.each { artifact ->

            def id = artifact.moduleVersion.id

            if (id.group.toLowerCase().contains('guava')
                    || artifact.name.toLowerCase()
                        .contains('guava')) {

                guavaArtifactCount++

                println "GUAVA_ARTIFACT: ${id}"
                println "GUAVA_FILE: ${artifact.file.name}"
                println "GUAVA_FILE_SIZE: ${artifact.file.length()}"

                if (artifact.file.name.endsWith('.jar')) {

                    def zip = new java.util.zip.ZipFile(
                        artifact.file
                    )

                    try {
                        if (zip.getEntry(targetClass) != null) {
                            runtimeStreamsFound = true
                            println 'GUAVA_STREAMS_IN_ARTIFACT: FOUND'
                        } else {
                            println 'GUAVA_STREAMS_IN_ARTIFACT: MISSING'
                        }
                    } finally {
                        zip.close()
                    }
                }
            }
        }

        println ''
        println '--- Final result ---'

        println "GUAVA_ARTIFACT_COUNT: ${guavaArtifactCount}"
        println "GUAVA_JRE_STREAMS_FOUND: ${jreStreamsFound}"
        println "GUAVA_RUNTIME_STREAMS_FOUND: ${runtimeStreamsFound}"

        if (!jreStreamsFound) {
            throw new GradleException(
                'Guava JRE Streams.class is missing'
            )
        }

        println 'GUAVA_DIAGNOSTICS: PASSED'
        println '========================================'
        println ''
    }
}

// ---------------------------------------------
// Run diagnostics before APK build
// ---------------------------------------------

tasks.matching {
    it.name == 'assembleDebug'
}.configureEach {

    dependsOn tasks.named('diagnoseGuava')
}
