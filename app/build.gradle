plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Извлекать libaapt2.so из APK.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {

    // Локальный Java-компилятор ECJ.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // Компиляция CLASS -> DEX.
    implementation 'com.android.tools:r8:8.7.18'

    // Подпись APK.
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Создание Android App Bundle.
    implementation 'com.android.tools.build:bundletool:1.18.2'

    // Protocol Buffers.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Явно выбираем JRE-вариант Guava.
    implementation('com.google.guava:guava:33.3.1-jre') {
        attributes {
            attribute(
                org.gradle.api.attributes.java.TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
                objects.named(
                    org.gradle.api.attributes.java.TargetJvmEnvironment,
                    org.gradle.api.attributes.java.TargetJvmEnvironment.STANDARD_JVM
                )
            )
        }
    }
}
