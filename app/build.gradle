plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ECJ 3.18.0 — рабочий Java-компилятор.
    // Не обновляем: проверен на Android 12.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // Экспериментальное подключение R8 / D8.
    // D8 преобразует Java .class в Android .dex.
    // Совместимость с Android Runtime пока не проверена.
    implementation 'com.android.tools:r8:8.7.18'
}
