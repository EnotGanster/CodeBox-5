plugins {
    id 'com.android.application'
}

configurations {
    guavaJreJar
}

configurations.configureEach { configuration ->
    if (configuration.name != 'guavaJreJar') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.jnitest'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0-jni-test'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'

    implementation 'org.eclipse.jdt:ecj:3.18.0'
    implementation 'com.android.tools:r8:8.7.18'
    implementation 'com.android.tools.build:apksig:8.7.3'

    implementation('com.android.tools.build:bundletool:1.18.2') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }

    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    guavaJreJar 'com.google.guava:guava:33.3.1-jre@jar'
    implementation files({ configurations.guavaJreJar.files })
    implementation 'com.google.guava:failureaccess:1.0.2'

    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
}
