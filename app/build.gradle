plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ---------------------------------------------
// CodeBox 5 - dependency configurations
// ---------------------------------------------

configurations {

    bundletoolDependencies {
        transitive = true
    }

    guavaJreJar {
        transitive = false
        canBeConsumed = false
        canBeResolved = true
    }
}

// ---------------------------------------------
// Prevent duplicate Guava classes
// ---------------------------------------------

configurations.configureEach { config ->

    if (config.name != 'guavaJreJar'
            && config.name != 'bundletoolDependencies') {

        exclude group: 'com.google.guava',
                module: 'guava'
    }
}

// ---------------------------------------------
// Dependencies
// ---------------------------------------------

dependencies {

    // Java compiler.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // CLASS to DEX.
    implementation 'com.android.tools:r8:8.7.18'

    // APK signing.
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Patched bundletool.
    implementation files(
        'libs/bundletool-patched-1.18.2.jar'
    )

    // Bundletool transitive dependencies.
    bundletoolDependencies(
        'com.android.tools.build:bundletool:1.18.2'
    )

    // Protocol Buffers.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Full JRE Guava JAR.
    guavaJreJar(
        'com.google.guava:guava:33.3.1-jre@jar'
    )

    // Include only the full JRE Guava.
    implementation files({
        configurations.guavaJreJar.files
    })

    // Supporting Guava dependency.
    implementation 'com.google.guava:failureaccess:1.0.2'
}

// ---------------------------------------------
// Transfer bundletool dependencies
// ---------------------------------------------

def bundletoolDependencyArtifacts =
    configurations.bundletoolDependencies
        .incoming
        .resolutionResult

afterEvaluate {

    def rootComponent =
        bundletoolDependencyArtifacts.root

    rootComponent.dependencies.each { dependency ->

        if (dependency instanceof
                org.gradle.api.artifacts.result.ResolvedDependencyResult) {

            def selected = dependency.selected

            if (selected.moduleVersion != null
                    && selected.moduleVersion.group ==
                    'com.android.tools.build'
                    && selected.moduleVersion.name == 'bundletool') {

                selected.dependencies.each { child ->

                    if (child instanceof
                            org.gradle.api.artifacts.result.ResolvedDependencyResult) {

                        def module = child.selected.moduleVersion

                        if (module != null
                                && !(module.group ==
                                    'com.android.tools.build'
                                    && module.name == 'bundletool')
                                && !(module.group ==
                                    'com.google.guava'
                                    && module.name == 'guava')) {

                            dependencies.add(
                                'implementation',
                                "${module.group}:${module.name}:${module.version}"
                            )
                        }
                    }
                }
            }
        }
    }
}

// ---------------------------------------------
// Guava diagnostics
// ---------------------------------------------

tasks.register('diagnoseGuava') {

    doLast {

        println ''
        println '========================================'
        println 'CODEBOX 5 - GUAVA DIAGNOSTICS'
        println '========================================'

        def targetClass =
            'com/google/common/collect/Streams.class'

        def jreFiles =
            configurations.guavaJreJar.resolve()

        boolean streamsFound = false

        println ''
        println '--- JRE Guava ---'

        jreFiles.each { file ->

            println "GUAVA_JRE_FILE: ${file.name}"
            println "GUAVA_JRE_SIZE: ${file.length()}"

            if (file.name.endsWith('.jar')) {

                def zip = new java.util.zip.ZipFile(file)

                try {

                    if (zip.getEntry(targetClass) != null) {

                        streamsFound = true
                        println 'GUAVA_JRE_STREAMS: FOUND'

                    } else {

                        println 'GUAVA_JRE_STREAMS: MISSING'
                    }

                } finally {
                    zip.close()
                }
            }
        }

        println ''
        println '--- Android runtime ---'

        def runtime =
            configurations.getByName(
                'debugRuntimeClasspath'
            )

        def artifacts =
            runtime.resolvedConfiguration.resolvedArtifacts

        boolean androidGuavaFound = false

        artifacts.each { artifact ->

            def id = artifact.moduleVersion.id

            if (id.group == 'com.google.guava'
                    && id.name == 'guava') {

                androidGuavaFound = true

                println "UNEXPECTED_GUAVA: ${artifact.file.name}"
            }
        }

        println ''
        println '--- Final result ---'

        println "GUAVA_STREAMS_FOUND: ${streamsFound}"
        println "ANDROID_GUAVA_FOUND: ${androidGuavaFound}"

        if (!streamsFound) {
            throw new GradleException(
                'Full Guava JRE is missing Streams.class'
            )
        }

        if (androidGuavaFound) {
            throw new GradleException(
                'Duplicate Guava dependency detected'
            )
        }

        println 'GUAVA_DIAGNOSTICS: PASSED'
        println '========================================'
        println ''
    }
}

// ---------------------------------------------
// Diagnostics before APK build
// ---------------------------------------------

tasks.matching {
    it.name == 'assembleDebug'
}.configureEach {

    dependsOn tasks.named('diagnoseGuava')
}
