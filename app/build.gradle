plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Извлекать libaapt2.so из APK
            // в каталог нативных библиотек.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Проверенный ECJ для Android 12.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // Рабочая компиляция CLASS -> DEX.
    implementation 'com.android.tools:r8:8.7.18'

    // Подпись APK и проверка подписи.
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Создание Android App Bundle.
    implementation 'com.android.tools.build:bundletool:1.18.2'

    // Protocol Buffers для BundleConfig.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Google Guava для API bundletool.
    implementation 'com.google.guava:guava:33.3.1-android'
}
