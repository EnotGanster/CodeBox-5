plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Извлекать libaapt2.so из APK.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// --------------------------------------------------
// CodeBox 5 — зависимости bundletool
// --------------------------------------------------

// Получаем транзитивные зависимости bundletool,
// не добавляя оригинальный bundletool.jar в APK.
configurations {
    bundletoolDependencies {
        transitive = true
    }
}

// --------------------------------------------------
// Основные зависимости CodeBox 5
// --------------------------------------------------

dependencies {

    // Локальный Java-компилятор.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // Преобразование CLASS -> DEX.
    implementation 'com.android.tools:r8:8.7.18'

    // Подпись APK.
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Исправленный bundletool 1.18.2.
    // В JAR уже находятся наши исправления.
    implementation files(
        'libs/bundletool-patched-1.18.2.jar'
    )

    // Получение зависимостей оригинального bundletool.
    bundletoolDependencies(
        'com.android.tools.build:bundletool:1.18.2'
    )

    // Protocol Buffers.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Полная версия Guava.
    implementation 'com.google.guava:guava:33.3.1-jre'
}

// --------------------------------------------------
// Подключение транзитивных зависимостей bundletool
// --------------------------------------------------

def bundletoolDependencyArtifacts =
    configurations.bundletoolDependencies
        .incoming
        .resolutionResult

afterEvaluate {

    def rootComponent =
        bundletoolDependencyArtifacts.root

    rootComponent.dependencies.each { dependency ->

        if (dependency instanceof
                org.gradle.api.artifacts.result.ResolvedDependencyResult) {

            def selected = dependency.selected

            if (selected.moduleVersion != null
                    && selected.moduleVersion.group ==
                    'com.android.tools.build'
                    && selected.moduleVersion.name == 'bundletool') {

                selected.dependencies.each { child ->

                    if (child instanceof
                            org.gradle.api.artifacts.result.ResolvedDependencyResult) {

                        def module = child.selected.moduleVersion

                        if (module != null
                                && !(module.group ==
                                    'com.android.tools.build'
                                    && module.name == 'bundletool')) {

                            dependencies.add(
                                'implementation',
                                "${module.group}:${module.name}:${module.version}"
                            )
                        }
                    }
                }
            }
        }
    }
}

// --------------------------------------------------
// Проверка Guava Streams в JAR
// --------------------------------------------------

tasks.register('verifyGuavaStreams') {

    doLast {

        def guavaArtifacts =
            configurations.debugRuntimeClasspath
                .resolvedConfiguration
                .resolvedArtifacts
                .findAll { artifact ->
                    artifact.moduleVersion.id.group ==
                        'com.google.guava'
                    && artifact.name == 'guava'
                }

        if (guavaArtifacts.isEmpty()) {
            throw new GradleException(
                'GUAVA: MISSING'
            )
        }

        guavaArtifacts.each { artifact ->

            println "GUAVA_SELECTED: ${artifact.moduleVersion.id}"

            def jarFile = artifact.file

            if (!jarFile.name.endsWith('.jar')) {
                throw new GradleException(
                    "Ожидался JAR Guava: ${jarFile.name}"
                )
            }

            def zip = new java.util.zip.ZipFile(jarFile)

            try {

                def entry = zip.getEntry(
                    'com/google/common/collect/Streams.class'
                )

                if (entry == null) {
                    throw new GradleException(
                        'GUAVA_STREAMS: MISSING'
                    )
                }

                println 'GUAVA_STREAMS: FOUND'

            } finally {
                zip.close()
            }
        }
    }
}

// --------------------------------------------------
// Проверка Streams в собранном APK
// --------------------------------------------------

tasks.register('verifyGuavaInApk') {

    dependsOn 'assembleDebug'

    doLast {

        def apkFile = file(
            "$buildDir/outputs/apk/debug/app-debug.apk"
        )

        if (!apkFile.isFile()) {
            throw new GradleException(
                "APK_NOT_FOUND: ${apkFile.absolutePath}"
            )
        }

        println "APK_FOUND: ${apkFile.absolutePath}"
        println "APK_SIZE: ${apkFile.length()}"

        def zip = new java.util.zip.ZipFile(apkFile)

        try {

            def dexEntries = []

            def entries = zip.entries()

            while (entries.hasMoreElements()) {

                def entry = entries.nextElement()

                if (entry.name ==~ /classes(\d*)\.dex/) {
                    dexEntries.add(entry)
                }
            }

            if (dexEntries.isEmpty()) {
                throw new GradleException(
                    'APK_DEX: MISSING'
                )
            }

            println "APK_DEX_FILES: ${dexEntries.size()}"

            // DEX хранит имена классов в таблице строк.
            // Ищем дескриптор Streams во всех DEX.
            def descriptor =
                'Lcom/google/common/collect/Streams;'
                    .getBytes('UTF-8')

            boolean found = false

            dexEntries.each { entry ->

                def input = zip.getInputStream(entry)

                try {

                    byte[] bytes = input.bytes

                    for (int i = 0;
                         i <= bytes.length - descriptor.length;
                         i++) {

                        boolean match = true

                        for (int j = 0;
                             j < descriptor.length;
                             j++) {

                            if (bytes[i + j] != descriptor[j]) {
                                match = false
                                break
                            }
                        }

                        if (match) {
                            found = true
                            println "STREAMS_DESCRIPTOR_FOUND_IN: ${entry.name}"
                            break
                        }
                    }

                } finally {
                    input.close()
                }
            }

            if (!found) {
                throw new GradleException(
                    'APK_GUAVA_STREAMS: MISSING'
                )
            }

            println 'APK_GUAVA_STREAMS: FOUND'

        } finally {
            zip.close()
        }
    }
}

// --------------------------------------------------
// Запуск проверок
// --------------------------------------------------

tasks.named('assembleDebug') {
    dependsOn tasks.named('verifyGuavaStreams')
}

// Проверяем итоговый APK при обычной сборке.
// finalizedBy запускает проверку после assembleDebug.
tasks.named('assembleDebug') {
    finalizedBy tasks.named('verifyGuavaInApk')
}
