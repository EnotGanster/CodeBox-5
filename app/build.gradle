plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.codebox.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.codebox.app'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Извлекать libaapt2.so из APK.
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// --------------------------------------------------
// CodeBox 5 — зависимости bundletool
// --------------------------------------------------

configurations {
    bundletoolDependencies {
        transitive = true
    }
}

// --------------------------------------------------
// Основные зависимости
// --------------------------------------------------

dependencies {

    // Локальный Java-компилятор.
    implementation 'org.eclipse.jdt:ecj:3.18.0'

    // Преобразование CLASS -> DEX.
    implementation 'com.android.tools:r8:8.7.18'

    // Подпись APK.
    implementation 'com.android.tools.build:apksig:8.7.3'

    // Исправленный bundletool 1.18.2.
    implementation files(
        'libs/bundletool-patched-1.18.2.jar'
    )

    // Транзитивные зависимости bundletool.
    bundletoolDependencies(
        'com.android.tools.build:bundletool:1.18.2'
    )

    // Protocol Buffers.
    implementation 'com.google.protobuf:protobuf-java:3.25.5'

    // Guava JRE.
    implementation 'com.google.guava:guava:33.3.1-jre'
}

// --------------------------------------------------
// Перенос зависимостей bundletool
// --------------------------------------------------

def bundletoolDependencyArtifacts =
    configurations.bundletoolDependencies
        .incoming
        .resolutionResult

afterEvaluate {

    def rootComponent =
        bundletoolDependencyArtifacts.root

    rootComponent.dependencies.each { dependency ->

        if (dependency instanceof
                org.gradle.api.artifacts.result.ResolvedDependencyResult) {

            def selected = dependency.selected

            if (selected.moduleVersion != null
                    && selected.moduleVersion.group ==
                    'com.android.tools.build'
                    && selected.moduleVersion.name == 'bundletool') {

                selected.dependencies.each { child ->

                    if (child instanceof
                            org.gradle.api.artifacts.result.ResolvedDependencyResult) {

                        def module = child.selected.moduleVersion

                        if (module != null
                                && !(module.group ==
                                    'com.android.tools.build'
                                    && module.name == 'bundletool')) {

                            dependencies.add(
                                'implementation',
                                "${module.group}:${module.name}:${module.version}"
                            )
                        }
                    }
                }
            }
        }
    }
}

// --------------------------------------------------
// Подробная диагностика Guava
// --------------------------------------------------

tasks.register('diagnoseGuava') {

    doLast {

        println ''
        println '========================================'
        println 'CODEBOX 5 - GUAVA DIAGNOSTICS'
        println '========================================'

        println 'GUAVA_REQUESTED: 33.3.1-jre'

        def runtime =
            configurations.getByName('debugRuntimeClasspath')

        println ''
        println '--- Resolved components ---'

        def components =
            runtime.incoming.resolutionResult.allComponents

        components.each { component ->

            def module = component.moduleVersion

            if (module != null
                    && module.group.toLowerCase()
                        .contains('guava')) {

                println "GUAVA_RESOLVED: ${module.group}:${module.name}:${module.version}"
            }
        }

        println ''
        println '--- Resolved artifacts ---'

        def artifacts =
            runtime.resolvedConfiguration.resolvedArtifacts

        int guavaArtifactCount = 0
        boolean streamsFound = false

        artifacts.each { artifact ->

            def id = artifact.moduleVersion.id

            if (id.group.toLowerCase().contains('guava')
                    || artifact.name.toLowerCase()
                        .contains('guava')) {

                guavaArtifactCount++

                println "GUAVA_ARTIFACT: ${id}"
                println "GUAVA_FILE: ${artifact.file.absolutePath}"
                println "GUAVA_FILE_SIZE: ${artifact.file.length()}"

                if (artifact.file.name.endsWith('.jar')) {

                    def zip = new java.util.zip.ZipFile(
                        artifact.file
                    )

                    try {

                        def entry = zip.getEntry(
                            'com/google/common/collect/Streams.class'
                        )

                        if (entry != null) {

                            streamsFound = true

                            println 'GUAVA_STREAMS_IN_ARTIFACT: FOUND'

                        } else {

                            println 'GUAVA_STREAMS_IN_ARTIFACT: MISSING'
                        }

                    } finally {
                        zip.close()
                    }

                } else {

                    println 'GUAVA_ARTIFACT_FORMAT: NOT_JAR'
                }
            }
        }

        println ''
        println '--- Final result ---'

        println "GUAVA_ARTIFACT_COUNT: ${guavaArtifactCount}"

        if (streamsFound) {
            println 'GUAVA_STREAMS: FOUND'
        } else {
            println 'GUAVA_STREAMS: NOT_FOUND_IN_SCANNED_ARTIFACTS'
        }

        println 'GUAVA_DIAGNOSTICS: COMPLETED'
        println '========================================'
        println ''
    }
}

// --------------------------------------------------
// Запуск диагностики при сборке APK
// --------------------------------------------------

// Не обращаемся к assembleDebug через tasks.named()
// во время первоначальной настройки Gradle.
tasks.matching {
    it.name == 'assembleDebug'
}.configureEach {

    dependsOn tasks.named('diagnoseGuava')
}
